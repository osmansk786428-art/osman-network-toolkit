name: Python Syntax and Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python syntax
        run: |
          python -m py_compile Network-Toolkit.py
          python -m py_compile Network-Toolkit-V22.py
          python -m py_compile safe_network.py
          python -m py_compile safe_http_adapter.py

      - name: Run legacy tests
        run: python -m unittest discover -s tests -v

      - name: Run V22 regression tests
        run: |
          python -m unittest -v \
            test_network_toolkit.py \
            test_network_toolkit_extra.py \
            test_pinned_connections.py \
            test_safe_http_adapter.py \
            test_safe_network.py \
            test_safe_request_methods.py \
            test_tls_verification.py \
            test_v22_security.py \
            test_v22_ui.py
